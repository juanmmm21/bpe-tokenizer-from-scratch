[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpe-tokenizer-from-scratch"
version = "0.1.0"
description = "Byte-level BPE tokenizer trained from scratch, with save/load of merges."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["bpe_tokenizer_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
